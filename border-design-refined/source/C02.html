<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>C02 겹친 코너 곡선</title><link rel="stylesheet" href="cards.css"></head><body><article class="card card--function"><svg class="border-decoration" viewBox="0 0 1080 1350" aria-hidden="true"><rect x="34" y="34" width="1012" height="1282" rx="46" fill="none" stroke="#e9f3f9" stroke-width="18"/><rect x="34" y="34" width="1012" height="1282" rx="46" fill="none" stroke="#d0e2ee" stroke-width="1.5"/><g fill="none" stroke-linecap="round"><path d="M34 162V82Q34 34 82 34H162" stroke="#c2dcee" stroke-width="5"/><path d="M50 148V88Q50 50 88 50H148" stroke="#e1edf6" stroke-width="5"/><path d="M918 1316H998Q1046 1316 1046 1268V1188" stroke="#c2dcee" stroke-width="5"/><path d="M932 1300H992Q1030 1300 1030 1262V1202" stroke="#e1edf6" stroke-width="5"/></g><circle cx="170" cy="34" r="3" fill="#c2dcee"/><circle cx="910" cy="1316" r="3" fill="#c2dcee"/></svg><h1 class="card__headline">힘줄 길어짐과<br>관련된 <span class="accent">기능 변화</span></h1>
<div class="function-list">
<div class="function-item"><div class="function-word">까치발</div><div class="function-text"><strong>낮아지는 까치발</strong><p>한 발로 올라가는 높이가<br>반대쪽보다 낮을 수 있습니다.</p></div></div>
<div class="function-item"><div class="function-word">밀어내기</div><div class="function-text"><strong>약해지는 밀어내기</strong><p>걷기·달리기에서 밀어내는<br>동작이 달라질 수 있습니다.</p></div></div>
<div class="function-item"><div class="function-word">반복 능력</div><div class="function-text"><strong>줄어드는 반복 능력</strong><p>반복할수록 높이가 낮아지거나<br>쉽게 지칠 수 있습니다.</p></div></div>
</div>
<p class="function-note">이 변화는 길어짐만의 증상이 아닙니다.<br>근육 위축·근력 저하 등도 함께 작용합니다.</p>
<p class="function-last note">통증의 유무만으로 길어짐을 판단할 수 없습니다.</p></article></body></html>
