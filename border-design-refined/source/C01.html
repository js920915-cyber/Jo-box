<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>C01 블루 그라데이션</title><link rel="stylesheet" href="cards.css"></head><body><article class="card card--function"><svg class="border-decoration" viewBox="0 0 1080 1350" aria-hidden="true"><defs><linearGradient id="tone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e3eff8"/><stop offset=".45" stop-color="#f5f9fc"/><stop offset="1" stop-color="#daeaf5"/></linearGradient></defs><rect x="34" y="34" width="1012" height="1282" rx="46" fill="none" stroke="url(#tone)" stroke-width="22"/><rect x="34" y="34" width="1012" height="1282" rx="46" fill="none" stroke="#cbdfea" stroke-width="1.5"/><rect x="48" y="48" width="984" height="1254" rx="34" fill="none" stroke="#edf4f9" stroke-width="1.5"/><path d="M482 34H598M482 1316H598" stroke="#b5d3e7" stroke-width="5" stroke-linecap="round"/></svg><h1 class="card__headline">힘줄 길어짐과<br>관련된 <span class="accent">기능 변화</span></h1>
<div class="function-list">
<div class="function-item"><div class="function-word">까치발</div><div class="function-text"><strong>낮아지는 까치발</strong><p>한 발로 올라가는 높이가<br>반대쪽보다 낮을 수 있습니다.</p></div></div>
<div class="function-item"><div class="function-word">밀어내기</div><div class="function-text"><strong>약해지는 밀어내기</strong><p>걷기·달리기에서 밀어내는<br>동작이 달라질 수 있습니다.</p></div></div>
<div class="function-item"><div class="function-word">반복 능력</div><div class="function-text"><strong>줄어드는 반복 능력</strong><p>반복할수록 높이가 낮아지거나<br>쉽게 지칠 수 있습니다.</p></div></div>
</div>
<p class="function-note">이 변화는 길어짐만의 증상이 아닙니다.<br>근육 위축·근력 저하 등도 함께 작용합니다.</p>
<p class="function-last note">통증의 유무만으로 길어짐을 판단할 수 없습니다.</p></article></body></html>
